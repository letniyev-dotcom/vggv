name: Build release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # The release keystore (app/mimika-release.jks) is committed in this
      # repo, same as Letify's own dev-CI keystore — it's what makes the APK
      # this workflow produces installable straight off the Actions artifact
      # with no extra setup. It is NOT a Play Store production key; swap it
      # (and the signingConfig in app/build.gradle.kts) before a real store
      # release.
      - name: Build signed RELEASE apk (never debug)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimika-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Only on a version tag (e.g. `git tag v1.0.0 && git push --tags`):
      # publish the APK directly on a GitHub Release for a one-click download.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
